name: render designs

# render the allowlisted boards (the list lives in tools/render.sh) and publish
# a gallery to github pages. renders are build outputs, not committed to the
# repo. each board renders in its own matrix job and is cached on the hash of
# its kicad files + render.sh, so only boards that actually changed re-render.
on:
  push:
    paths:
      - 'boards/**'
      - 'tools/render.sh'
      - 'tools/gallery.py'
      - '.github/workflows/render.yml'
  workflow_dispatch:

# newest push wins; cancel an in-flight render/deploy for the same ref
concurrency:
  group: render-pages-${{ github.ref }}
  cancel-in-progress: true

# bump to force every board to re-render (e.g. after a render flag change that
# render.sh's hash does not capture, or a my_pcb_lib model update)
env:
  RENDER_CACHE_VERSION: v1

jobs:
  # the render allowlist is defined once, in tools/render.sh; read it here so
  # adding a board is a one-line change in that script
  plan:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: read board allowlist
        id: list
        run: echo "boards=$(bash tools/render.sh --list-json)" >>"$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: mark workspace safe for git
        run: git config --global --add safe.directory '*'

      # BOARD/vX_rY -> BOARD_vX_rY, used for cache keys, artifact names and the
      # gallery card title
      - name: derive board slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.board }}' | tr '/' '_')" >>"$GITHUB_OUTPUT"

      # key on this board's kicad files + render.sh so an unchanged board
      # restores instantly and skips kicad-cli entirely
      - name: cache renders
        id: cache
        uses: actions/cache@v4
        with:
          path: boards/${{ matrix.board }}/renders
          key: renders-${{ env.RENDER_CACHE_VERSION }}-${{ steps.slug.outputs.slug }}-${{ hashFiles(format('boards/{0}/*.kicad_pcb', matrix.board), format('boards/{0}/*.kicad_sch', matrix.board), 'tools/render.sh') }}

      - name: locate stock 3d model dir
        if: steps.cache.outputs.cache-hit != 'true'
        # discover the real stock dir in this image and point all three model
        # vars at it, else stock ics/passives render as flat outlines
        run: |
          sample=$(find /usr -type f -name 'R_0402_1005Metric.step' \
            -path '*Resistor_SMD.3dshapes*' 2>/dev/null | head -1)
          if [ -z "$sample" ]; then
            echo "::error::stock 3d models not found in image"
            exit 1
          fi
          stock=$(dirname "$(dirname "$sample")")
          echo "stock 3d model dir: $stock"
          echo "KICAD10_3DMODEL_DIR=$stock" >>"$GITHUB_ENV"
          echo "KICAD9_3DMODEL_DIR=$stock"  >>"$GITHUB_ENV"
          echo "KISYS3DMOD=$stock"          >>"$GITHUB_ENV"

      - name: fetch custom footprint/3d library
        if: steps.cache.outputs.cache-hit != 'true'
        # boards reference custom models by absolute path; clone the public lib
        # into that exact path so those models resolve
        run: git clone --depth 1 https://github.com/akielaries/my_pcb_lib /home/akiel/trunk/pub/my_footprints

      - name: install xvfb
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb

      - name: render board
        if: steps.cache.outputs.cache-hit != 'true'
        # 3d render needs a display; render.sh <board> filters to that board
        run: xvfb-run -a bash tools/render.sh '${{ matrix.board }}'

      - name: stage renders
        run: |
          dst="renders_staged/${{ steps.slug.outputs.slug }}"
          mkdir -p "$dst"
          cp "boards/${{ matrix.board }}/renders/"* "$dst/"
          ls -l "$dst"

      - name: upload renders artifact
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ steps.slug.outputs.slug }}
          path: renders_staged
          if-no-files-found: error

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download every board's renders
        uses: actions/download-artifact@v4
        with:
          pattern: renders-*
          merge-multiple: true
          path: renders_staged

      - name: build gallery
        run: python3 tools/gallery.py renders_staged _site

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: deploy to github pages
        id: deploy
        uses: actions/deploy-pages@v4
