name: render designs

# render the allowlisted boards (see tools/render.sh) and publish a gallery to
# github pages. renders are build outputs, not committed to the repo.
# each board's renders are cached on the hash of its kicad files + render.sh,
# so only boards that actually changed re-render.
on:
  push:
    paths:
      - 'schematic/**'
      - 'tools/render.sh'
      - 'tools/gallery.py'
      - '.github/workflows/render.yml'
  workflow_dispatch:

# newest push wins; cancel an in-flight render/deploy for the same ref
concurrency:
  group: render-pages-${{ github.ref }}
  cancel-in-progress: true

# bump to force every board to re-render (e.g. after a render flag change that
# render.sh's hash does not capture, or a my_pcb_lib model update)
env:
  RENDER_CACHE_VERSION: v1

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: mark workspace safe for git
        run: git config --global --add safe.directory '*'

      # one cache per board: key on that board's kicad files + render.sh so an
      # unchanged board restores instantly and skips kicad-cli entirely
      - name: cache APM_v5_r2 renders
        id: cache_apm
        uses: actions/cache@v4
        with:
          path: schematic/APM_v5_r2/renders
          key: renders-${{ env.RENDER_CACHE_VERSION }}-APM_v5_r2-${{ hashFiles('schematic/APM_v5_r2/*.kicad_pcb', 'schematic/APM_v5_r2/*.kicad_sch', 'tools/render.sh') }}

      - name: cache ACM_v1_r2 renders
        id: cache_acm
        uses: actions/cache@v4
        with:
          path: schematic/ACM_v1_r2/renders
          key: renders-${{ env.RENDER_CACHE_VERSION }}-ACM_v1_r2-${{ hashFiles('schematic/ACM_v1_r2/*.kicad_pcb', 'schematic/ACM_v1_r2/*.kicad_sch', 'tools/render.sh') }}

      - name: cache OSC_CTRL renders
        id: cache_osc
        uses: actions/cache@v4
        with:
          path: schematic/OSC_CTRL/renders
          key: renders-${{ env.RENDER_CACHE_VERSION }}-OSC_CTRL-${{ hashFiles('schematic/OSC_CTRL/*.kicad_pcb', 'schematic/OSC_CTRL/*.kicad_sch', 'tools/render.sh') }}

      - name: cache AUDIO_BOARD_v1_r1 renders
        id: cache_audio
        uses: actions/cache@v4
        with:
          path: schematic/AUDIO_BOARD_v1_r1/renders
          key: renders-${{ env.RENDER_CACHE_VERSION }}-AUDIO_BOARD_v1_r1-${{ hashFiles('schematic/AUDIO_BOARD_v1_r1/*.kicad_pcb', 'schematic/AUDIO_BOARD_v1_r1/*.kicad_sch', 'tools/render.sh') }}

      - name: plan (any board need rendering?)
        id: plan
        run: |
          if [ "${{ steps.cache_apm.outputs.cache-hit }}" != "true" ] \
          || [ "${{ steps.cache_acm.outputs.cache-hit }}" != "true" ] \
          || [ "${{ steps.cache_osc.outputs.cache-hit }}" != "true" ] \
          || [ "${{ steps.cache_audio.outputs.cache-hit }}" != "true" ]; then
            echo "any_miss=true" >>"$GITHUB_OUTPUT"
          else
            echo "any_miss=false" >>"$GITHUB_OUTPUT"
            echo "all boards cached; skipping render setup"
          fi

      - name: locate stock 3d model dir
        if: steps.plan.outputs.any_miss == 'true'
        # discover the real stock dir in this image and point all three model
        # vars at it, else stock ics/passives render as flat outlines
        run: |
          sample=$(find /usr -type f -name 'R_0402_1005Metric.step' \
            -path '*Resistor_SMD.3dshapes*' 2>/dev/null | head -1)
          if [ -z "$sample" ]; then
            echo "::error::stock 3d models not found in image"
            exit 1
          fi
          stock=$(dirname "$(dirname "$sample")")
          echo "stock 3d model dir: $stock"
          echo "KICAD10_3DMODEL_DIR=$stock" >>"$GITHUB_ENV"
          echo "KICAD9_3DMODEL_DIR=$stock"  >>"$GITHUB_ENV"
          echo "KISYS3DMOD=$stock"          >>"$GITHUB_ENV"

      - name: fetch custom footprint/3d library
        if: steps.plan.outputs.any_miss == 'true'
        # boards reference custom models by absolute path; clone the public lib
        # into that exact path so those models resolve
        run: git clone --depth 1 https://github.com/akielaries/my_pcb_lib /home/akiel/trunk/pub/my_footprints

      - name: install xvfb
        if: steps.plan.outputs.any_miss == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb

      - name: render only the changed boards
        if: steps.plan.outputs.any_miss == 'true'
        # 3d render needs a display; render.sh <board> filters to that board
        run: |
          render_one() {
            echo "::group::render $1"
            xvfb-run -a bash tools/render.sh "$1"
            echo "::endgroup::"
          }
          [ "${{ steps.cache_apm.outputs.cache-hit }}"   = "true" ] || render_one APM_v5_r2
          [ "${{ steps.cache_acm.outputs.cache-hit }}"   = "true" ] || render_one ACM_v1_r2
          [ "${{ steps.cache_osc.outputs.cache-hit }}"   = "true" ] || render_one OSC_CTRL
          [ "${{ steps.cache_audio.outputs.cache-hit }}" = "true" ] || render_one AUDIO_BOARD_v1_r1

      - name: stage renders (one dir per board)
        run: |
          mkdir -p renders_staged
          find schematic -path '*/renders/*' -type f | while read -r f; do
            board=$(echo "$f" | sed -E 's#^schematic/(.+)/renders/[^/]+$#\1#')
            mkdir -p "renders_staged/$board"
            cp "$f" "renders_staged/$board/"
          done
          find renders_staged -maxdepth 1 -mindepth 1 -type d | sort

      - name: upload renders artifact
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders_staged
          if-no-files-found: error

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download renders artifact
        uses: actions/download-artifact@v4
        with:
          name: renders
          path: renders_staged

      - name: build gallery
        run: python3 tools/gallery.py renders_staged _site

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: deploy to github pages
        id: deploy
        uses: actions/deploy-pages@v4
