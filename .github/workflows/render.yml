name: render designs

# render the allowlisted boards (the list lives in tools/render.sh) and publish
# a gallery to github pages. renders are build outputs, not committed to the
# repo. each board renders in its own matrix job and is cached on the hash of
# its kicad files + render scripts, so only boards that actually changed
# re-render. the cache is checked before the kicad image is pulled, so an
# unchanged board's job takes seconds
on:
  push:
    paths:
      - 'boards/**'
      - 'tools/render.sh'
      - 'tools/ci_render.sh'
      - 'tools/gallery.py'
      - 'tools/mddoc.py'
      - '.github/workflows/render.yml'
      # generator scripts, local checkpoints, kicad backups and per-user ui
      # state never change a render or a doc page
      - '!boards/**/gen/**'
      - '!boards/**/checkpoints/**'
      - '!boards/**/*-backups/**'
      - '!boards/**/*.kicad_prl'
  workflow_dispatch:

# newest push wins; cancel an in-flight render/deploy for the same ref
concurrency:
  group: render-pages-${{ github.ref }}
  cancel-in-progress: true

# bump to force every board to re-render (e.g. after a render flag change that
# render.sh's hash does not capture, or a my_pcb_lib model update)
env:
  RENDER_CACHE_VERSION: v1

jobs:
  # the render allowlist is defined once, in tools/render.sh; read it here so
  # adding a board is a one-line change in that script
  plan:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.list.outputs.boards }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: read board allowlist
        id: list
        run: echo "boards=$(bash tools/render.sh --list-json)" >>"$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.plan.outputs.boards) }}
    # no job-level container: pulling kicad/kicad:10.0-full costs minutes even
    # when the cache hits. the image is only run (docker run) on a cache miss
    steps:
      - name: checkout
        uses: actions/checkout@v4

      # BOARD/vX_rY -> BOARD_vX_rY, used for cache keys, artifact names and the
      # gallery card title
      - name: derive board slug
        id: slug
        run: echo "slug=$(echo '${{ matrix.board }}' | tr '/' '_')" >>"$GITHUB_OUTPUT"

      # key on this board's kicad files + render scripts so an unchanged board
      # restores instantly and skips kicad-cli entirely
      - name: cache renders
        id: cache
        uses: actions/cache@v4
        with:
          path: boards/${{ matrix.board }}/renders
          key: renders-${{ env.RENDER_CACHE_VERSION }}-${{ steps.slug.outputs.slug }}-${{ hashFiles(format('boards/{0}/*.kicad_pcb', matrix.board), format('boards/{0}/*.kicad_sch', matrix.board), format('boards/{0}/3dmodels/**', matrix.board), 'tools/render.sh', 'tools/ci_render.sh') }}

      - name: render board (kicad container, cache miss only)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm --user root -v "$GITHUB_WORKSPACE:/w" -w /w \
            kicad/kicad:10.0-full bash tools/ci_render.sh '${{ matrix.board }}'
          sudo chown -R "$(id -u):$(id -g)" 'boards/${{ matrix.board }}/renders'

      - name: stage renders
        run: |
          dst="renders_staged/${{ steps.slug.outputs.slug }}"
          mkdir -p "$dst"
          cp -r "boards/${{ matrix.board }}/renders/"* "$dst/"
          ls -l "$dst"

      - name: upload renders artifact
        uses: actions/upload-artifact@v4
        with:
          name: renders-${{ steps.slug.outputs.slug }}
          path: renders_staged
          if-no-files-found: error

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download every board's renders
        uses: actions/download-artifact@v4
        with:
          pattern: renders-*
          merge-multiple: true
          path: renders_staged

      # refresh every board's docs/export/*.svg from the committed .drawio
      # sources so the published diagrams always match their source
      - name: export draw.io diagrams
        uses: rlespinasse/drawio-export-action@v2
        with:
          path: boards
          format: svg
          output: export
          action-mode: all
          remove-page-suffix: true
          border: 10
          embed-svg-fonts: true

      - name: build gallery
        run: python3 tools/gallery.py renders_staged _site

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: deploy to github pages
        id: deploy
        uses: actions/deploy-pages@v4
