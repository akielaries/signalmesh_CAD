name: render designs

# render the allowlisted boards (see tools/render.sh) and publish a gallery to
# github pages. renders are build outputs, not committed to the repo.
on:
  push:
    paths:
      - 'schematic/**'
      - 'tools/render.sh'
      - 'tools/gallery.py'
      - '.github/workflows/render.yml'
  workflow_dispatch:

# newest push wins; cancel an in-flight render/deploy for the same ref
concurrency:
  group: render-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:10.0-full
      options: --user root
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: mark workspace safe for git
        run: git config --global --add safe.directory '*'

      - name: locate stock 3d model dir
        # discover the real stock dir in this image and point all three model
        # vars at it, else stock ics/passives render as flat outlines
        run: |
          sample=$(find /usr -type f -name 'R_0402_1005Metric.step' \
            -path '*Resistor_SMD.3dshapes*' 2>/dev/null | head -1)
          if [ -z "$sample" ]; then
            echo "::error::stock 3d models not found in image"
            exit 1
          fi
          stock=$(dirname "$(dirname "$sample")")
          echo "stock 3d model dir: $stock"
          echo "KICAD10_3DMODEL_DIR=$stock" >>"$GITHUB_ENV"
          echo "KICAD9_3DMODEL_DIR=$stock"  >>"$GITHUB_ENV"
          echo "KISYS3DMOD=$stock"          >>"$GITHUB_ENV"

      - name: fetch custom footprint/3d library
        # boards reference custom models by absolute path; clone the public lib
        # into that exact path so those models resolve
        run: git clone --depth 1 https://github.com/akielaries/my_pcb_lib /home/akiel/trunk/pub/my_footprints

      - name: install xvfb
        run: |
          apt-get update
          apt-get install -y --no-install-recommends xvfb

      - name: render allowlisted boards
        # 3d render needs a display; render.sh renders only the allowlist
        run: xvfb-run -a bash tools/render.sh

      - name: stage renders (one dir per board)
        run: |
          mkdir -p renders_staged
          find schematic -path '*/renders/*' -type f | while read -r f; do
            board=$(echo "$f" | sed -E 's#^schematic/(.+)/renders/[^/]+$#\1#')
            mkdir -p "renders_staged/$board"
            cp "$f" "renders_staged/$board/"
          done
          find renders_staged -maxdepth 1 -mindepth 1 -type d | sort

      - name: upload renders artifact
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders_staged
          if-no-files-found: error

  deploy:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download renders artifact
        uses: actions/download-artifact@v4
        with:
          name: renders
          path: renders_staged

      - name: build gallery
        run: python3 tools/gallery.py renders_staged _site

      - name: upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: deploy to github pages
        id: deploy
        uses: actions/deploy-pages@v4
