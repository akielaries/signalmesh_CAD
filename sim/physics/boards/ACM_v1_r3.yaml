# ACM v1 r2 (audio compute module, Tang Nano 20K / GW2AR FPGA)
# ACM nets are FPGA-ball named (e.g. /A10_IOL14B), no clean bus regex, so this
# board runs mostly in auto-discover mode: the audit ranks all routed nets by
# length and flags the electrically-long ones that are off controlled impedance.
name: ACM_v1_r3
kicad_pcb: ../../schematic/ACM_v1_r3/ACM_v1_r3.kicad_pcb
stackup: default
netclasses: default

rise_ps: 1000

# add named groups here once the FMC<->FPGA / audio buses are identified.
groups: []
